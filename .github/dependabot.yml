version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      non-major-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      non-major-go-modules:
        update-types:
          - minor
          - patch
